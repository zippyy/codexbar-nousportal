name: Build and release plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nousportal-release-${{ github.ref_name }}-${{ inputs.version || 'tag' }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-26

    steps:
      - name: Checkout Nous Portal plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="$GITHUB_REF_NAME"
            prerelease=false
            [[ "$version" == *-* ]] && prerelease=true
          else
            version="$DISPATCH_VERSION"
            prerelease="${DISPATCH_PRERELEASE:-false}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            echo "Expected v1.2.3 or v1.2.3-beta.1" >&2
            exit 2
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Run plugin fixture tests
        run: node tests/plugin.test.mjs

      - name: Checkout current CodexBar
        uses: actions/checkout@v4
        with:
          repository: steipete/CodexBar
          path: CodexBar
          fetch-depth: 1

      - name: Select CodexBar Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "${candidate}/Contents/Developer"
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "No supported Xcode 26.x installation found." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=${selected}/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Record tested CodexBar revision
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C CodexBar rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "CodexBar revision: $sha"

      - name: Build stock CodexBar CLI
        working-directory: CodexBar
        run: swift build -c release --product CodexBarCLI

      - name: Validate plugin import in stock CodexBar
        shell: bash
        run: |
          set -euo pipefail
          plugin_home="$RUNNER_TEMP/plugin-home"
          mkdir -p "$plugin_home/.config/codexbar/providers"
          cp nousportal.js "$plugin_home/.config/codexbar/providers/nousportal.js"

          bin_dir="$(cd CodexBar && swift build -c release --show-bin-path)"
          output="$(HOME="$plugin_home" "$bin_dir/CodexBarCLI" plugins list)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F $'nous-portal\tNous Portal\t' >/dev/null

      - name: Build release asset
        shell: bash
        run: |
          bash ./build-release.sh \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.upstream.outputs.sha }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codexbar-nousportal-${{ steps.release.outputs.version }}
          path: |
            dist/*.js
            dist/*.sha256
            dist/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Generate release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## CodexBar Nous Portal plugin

          True user-installable CodexBar provider for Nous Portal subscription and credit usage.

          ### Install

          1. Download `codexbar-nousportal-${{ steps.release.outputs.version }}.js` from this release.
          2. Open **CodexBar → Settings → Plugins → Install…**.
          3. Select the downloaded `.js` file and approve access to `https://portal.nousresearch.com` and the Portal browser cookie.
          4. Sign in to `portal.nousresearch.com` in Chrome if you are not already signed in.
          5. Enable **Nous Portal** in CodexBar.

          No CodexBar rebuild and no Hermes credential-file access are required.

          ### Validation

          This release was loaded as a dynamic user plugin by stock CodexBar at commit:

          `${{ steps.upstream.outputs.sha }}`

          Fixture tests also validate billing parsing, rollover handling, expired authentication, and missing-cookie behavior.
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi

          args=(
            release create "$VERSION"
            dist/*.js
            dist/*.sha256
            dist/*.txt
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "CodexBar Nous Portal $VERSION"
            --notes-file release-notes.md
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          gh "${args[@]}"
