name: Build and release plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.2.0 or v0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nousportal-release-${{ github.ref_name }}-${{ inputs.version || 'tag' }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-26

    steps:
      - name: Checkout Nous Portal plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="$GITHUB_REF_NAME"
            prerelease=false
            [[ "$version" == *-* ]] && prerelease=true
          else
            raw_version="${DISPATCH_VERSION#v}"
            version="v${raw_version}"
            prerelease="${DISPATCH_PRERELEASE:-false}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 2
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Run plugin fixture tests
        run: node tests/plugin.test.mjs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: helper/go.mod

      - name: Test helper
        working-directory: helper
        run: |
          go test ./...
          go vet ./...

      - name: Build universal macOS helper
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build
          ldflags="-s -w -X main.version=$VERSION"
          (cd helper && GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$ldflags" -o ../build/helper-arm64 .)
          (cd helper && GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$ldflags" -o ../build/helper-amd64 .)
          lipo -create build/helper-arm64 build/helper-amd64 -output build/codexbar-nousportal-helper
          codesign --force --sign - build/codexbar-nousportal-helper
          lipo -info build/codexbar-nousportal-helper

      - name: Checkout current CodexBar
        uses: actions/checkout@v4
        with:
          repository: steipete/CodexBar
          path: CodexBar
          fetch-depth: 1

      - name: Select CodexBar Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "${candidate}/Contents/Developer"
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "No supported Xcode 26.x installation found." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=${selected}/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Record tested CodexBar revision
        id: upstream
        shell: bash
        run: |
          sha="$(git -C CodexBar rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build stock CodexBar CLI
        working-directory: CodexBar
        run: swift build -c release --product CodexBarCLI

      - name: Validate plugin import in stock CodexBar
        shell: bash
        run: |
          set -euo pipefail
          providers_dir="$HOME/.config/codexbar/providers"
          plugin_path="$providers_dir/nousportal-ci.js"
          mkdir -p "$providers_dir"
          trap 'rm -f "$plugin_path"' EXIT
          cp nousportal.js "$plugin_path"

          bin_dir="$(cd CodexBar && swift build -c release --show-bin-path)"
          output="$("$bin_dir/CodexBarCLI" plugins list)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F $'nous-portal\tNous Portal\t' >/dev/null

      - name: Build release assets
        shell: bash
        run: |
          bash ./build-release.sh \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.upstream.outputs.sha }}" \
            build/codexbar-nousportal-helper

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codexbar-nousportal-${{ steps.release.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Generate release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## CodexBar Nous Portal plugin

          Importable CodexBar provider for Nous Portal subscription and credit usage.

          ### Why the helper exists

          Nous Portal currently uses Privy's default browser localStorage session on many accounts. CodexBar user plugins can broker Chrome cookies but cannot read browser localStorage or `~/.hermes/auth.json`. The localhost helper bridges that gap without exposing OAuth tokens to the plugin.

          ### Install

          1. Download `codexbar-nousportal-${{ steps.release.outputs.version }}-macos.zip` and extract it.
          2. Run `./install-helper-${{ steps.release.outputs.version }}.sh` from the extracted folder.
          3. In CodexBar, choose **Settings → Plugins → Install…** and select `codexbar-nousportal-${{ steps.release.outputs.version }}.js`.
          4. Enter Helper URL: `http://127.0.0.1:38417`.
          5. Approve the loopback origin and enable the plugin.

          The helper binds only to `127.0.0.1`, reads the existing Hermes OAuth state, delegates refresh to Hermes, and returns only Nous account/billing JSON to CodexBar.

          ### Validation

          This release was loaded as a dynamic user plugin by stock CodexBar at commit `${{ steps.upstream.outputs.sha }}` and the universal helper was built for both Apple Silicon and Intel macOS.
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi

          args=(
            release create "$VERSION"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "CodexBar Nous Portal $VERSION"
            --notes-file release-notes.md
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          gh "${args[@]}"
