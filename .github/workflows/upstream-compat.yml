name: Upstream compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Checkout provider overlay
        uses: actions/checkout@v4

      - name: Checkout CodexBar
        uses: actions/checkout@v4
        with:
          repository: steipete/CodexBar
          path: CodexBar
          fetch-depth: 1

      - name: Select CodexBar Xcode toolchain
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "${candidate}/Contents/Developer"
              echo "DEVELOPER_DIR=${candidate}/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Apply Nous Portal provider
        run: ./apply.sh CodexBar

      - name: Run provider tests
        working-directory: CodexBar
        run: swift test --filter NousPortal

      - name: Smoke test release bundle
        run: |
          bash ./build-release.sh \
            v0.0.0-ci \
            "$(git -C CodexBar rev-parse HEAD)"
          test -s dist/codexbar-nousportal-v0.0.0-ci.zip
          test -s dist/codexbar-nousportal-v0.0.0-ci.tar.gz
          test -s dist/codexbar-nousportal-v0.0.0-ci.sha256
          (cd dist && shasum -a 256 -c codexbar-nousportal-v0.0.0-ci.sha256)
