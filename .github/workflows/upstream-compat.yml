name: Upstream compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26

    steps:
      - name: Checkout Nous Portal plugin
        uses: actions/checkout@v4

      - name: Run plugin fixture tests
        run: node tests/plugin.test.mjs

      - name: Check plugin size
        shell: bash
        run: |
          set -euo pipefail
          bytes="$(wc -c < nousportal.js | tr -d ' ')"
          echo "Plugin size: ${bytes} bytes"
          if (( bytes > 1048576 )); then
            echo "Plugin exceeds CodexBar's 1 MiB user-plugin limit." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: helper/go.mod

      - name: Test helper
        working-directory: helper
        run: |
          go test ./...
          go vet ./...

      - name: Build helper for both macOS architectures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          (cd helper && GOOS=darwin GOARCH=arm64 go build -trimpath -o ../build/helper-arm64 .)
          (cd helper && GOOS=darwin GOARCH=amd64 go build -trimpath -o ../build/helper-amd64 .)
          lipo -create build/helper-arm64 build/helper-amd64 -output build/codexbar-nousportal-helper
          lipo -info build/codexbar-nousportal-helper

      - name: Checkout current CodexBar
        uses: actions/checkout@v4
        with:
          repository: steipete/CodexBar
          path: CodexBar
          fetch-depth: 1

      - name: Select CodexBar Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "${candidate}/Contents/Developer"
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "No supported Xcode 26.x installation found." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=${selected}/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Build stock CodexBar CLI
        working-directory: CodexBar
        run: swift build -c release --product CodexBarCLI

      - name: Validate plugin discovery in stock CodexBar
        shell: bash
        run: |
          set -euo pipefail
          providers_dir="$HOME/.config/codexbar/providers"
          plugin_path="$providers_dir/nousportal-ci.js"
          mkdir -p "$providers_dir"
          trap 'rm -f "$plugin_path"' EXIT
          cp nousportal.js "$plugin_path"

          echo "Installed CI plugin at: $plugin_path"
          bin_dir="$(cd CodexBar && swift build -c release --show-bin-path)"
          output="$("$bin_dir/CodexBarCLI" plugins list)"
          printf '%s\n' "$output"

          if ! printf '%s\n' "$output" | grep -F $'nous-portal\tNous Portal\t' >/dev/null; then
            echo "Stock CodexBar did not discover the Nous Portal plugin." >&2
            echo "Expected plugin directory: $providers_dir" >&2
            ls -la "$providers_dir" >&2 || true
            exit 1
          fi
